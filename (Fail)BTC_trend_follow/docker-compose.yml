# docker-compose.yml - Docker 컨테이너 설정 파일
version: '3.8'

services:
  # 자동매매 봇 서비스
  btc-trend-bot:
    # 이미지 빌드 설정
    build:
      context: .  # 현재 폴더를 기준으로 빌드
      dockerfile: Dockerfile
    
    # 컨테이너 이름
    container_name: btc-trend-follower
    
    # 자동 재시작 설정 (항상 재시작)
    restart: unless-stopped
    
    # 환경변수 파일 (.env 파일 사용)
    env_file:
      - .env
    
    # 볼륨 마운트 (데이터 영구 저장)
    volumes:
      # 로그 파일을 호스트에 저장
      - ./logs:/app/logs
      # 리포트 파일을 호스트에 저장
      - ./reports:/app/reports
    
    # 로그 설정 (Docker 로그 크기 제한)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 네트워크 설정 (필요시)
    networks:
      - bot-network

# 네트워크 설정
networks:
  bot-network:
    driver: bridge

