services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bybit-personal-trader
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./configs:/app/configs
    restart: unless-stopped
    command: ["python", "-m", "src.cli", "status"]
