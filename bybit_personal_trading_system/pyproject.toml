[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bybit-personal-trading-system"
version = "0.1.0"
description = "Minimal production-minded Bybit personal trading system"
requires-python = ">=3.11"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "alerts*",
  "execution*",
  "portfolio*",
  "research*",
  "src*",
  "strategies*",
]
