# 실제 배포 전 base64 인코딩 필수:
#   echo -n 'your-value' | base64
#
# 프로덕션: AWS Secrets Manager + External Secrets Operator 사용 권장
apiVersion: v1
kind: Secret
metadata:
  name: msa-secret
  namespace: msa
type: Opaque
data:
  # echo -n 'prod-jwt-secret-change-me' | base64
  JWT_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE
  # echo -n 'msauser' | base64
  POSTGRES_USER: REPLACE_WITH_BASE64_ENCODED_VALUE
  # echo -n 'msapassword-change-me' | base64
  POSTGRES_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
