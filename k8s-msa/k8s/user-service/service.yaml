# NodePort: 외부에서 로그인 API 직접 호출 가능 (데모·테스트용)
# 프로덕션: Ingress로 교체 권장
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: msa
  labels:
    app: user-service
spec:
  type: NodePort
  selector:
    app: user-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30801
