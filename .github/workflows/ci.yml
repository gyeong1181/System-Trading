name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f psar_rsi_bot/requirements.txt ]; then pip install -r psar_rsi_bot/requirements.txt; fi
          if [ -f bybit_personal_trading_system/requirements.txt ]; then pip install -r bybit_personal_trading_system/requirements.txt; fi
      - name: Run lint (flake8)
        run: |
          pip install flake8
          flake8 . --max-line-length=120 || true
      - name: Run tests (pytest)
        run: |
          pip install pytest
          pytest -q psar_rsi_bot/tests bybit_personal_trading_system/tests
