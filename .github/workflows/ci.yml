name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  psar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PSAR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r psar_rsi_bot/requirements.txt
      - name: Run lint (flake8)
        run: |
          pip install flake8
          flake8 psar_rsi_bot --max-line-length=120 || true
      - name: Run PSAR tests
        run: |
          pytest -q psar_rsi_bot/tests

  bybit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bybit_personal_trading_system
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create isolated venv and install Bybit dependencies
        run: |
          python -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest
          pip install -r requirements.txt
          pip install --no-build-isolation -e .
      - name: Verify Bybit import path
        run: |
          . .venv-ci/bin/activate
          python -c "import src.config as config; print(config.__file__)"
      - name: Run Bybit tests
        run: |
          . .venv-ci/bin/activate
          python -m pytest -q tests
