name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    # GitHub Actions는 리눅스 런너(ubuntu)에서 실행됩니다.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Rsync to EC2
        run: |
          rsync -az --delete \
            --exclude '.git' \
            -e "ssh -i ~/.ssh/id_rsa" \
            ./ "${EC2_USER}@${EC2_HOST}:/opt/systemTrading"
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Restart service
        run: |
          ssh -i ~/.ssh/id_rsa "${EC2_USER}@${EC2_HOST}" "sudo systemctl daemon-reload && sudo systemctl restart psar_rsi_bot"
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
