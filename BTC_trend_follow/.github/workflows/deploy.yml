name: Deploy to AWS EC2

# GitHub Actions 워크플로우
# 코드가 main 브랜치에 푸시되면 자동으로 AWS EC2에 배포

on:
  push:
    branches:
      - main  # main 브랜치에 푸시될 때 실행
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest  # GitHub Actions 실행 환경 (Ubuntu)
    
    steps:
      # 1단계: 코드 체크아웃 (GitHub 저장소에서 코드 가져오기)
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2단계: 파일을 EC2로 전송
      - name: Deploy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}  # EC2 퍼블릭 IP
          username: ec2-user  # Amazon Linux 사용자명
          key: ${{ secrets.EC2_SSH_KEY }}  # SSH 개인키
          source: "*.py,requirements.txt,Dockerfile,docker-compose.yml,*.md"
          target: "/opt/btc_trend_follow"
          strip_components: 0
      
      # 3단계: EC2에서 Docker 재시작
      - name: Restart Docker on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/btc_trend_follow
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            docker-compose logs --tail=50

