version: "3.9"

services:
  psar_rsi_bot:
    build: .
    container_name: psar_rsi_bot
    env_file:
      - ../.env
    command: ["uvicorn", "webhook_server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./trade_signals.csv:/app/trade_signals.csv
      - ./data:/app/data
    restart: unless-stopped
