# 실제 배포 전 base64 인코딩 필수:
#   echo -n 'your-secret-value' | base64
#
# 프로덕션 권장:
#   AWS Secrets Manager → External Secrets Operator
#   또는 HashiCorp Vault + vault-agent-injector
#
# 이 파일은 절대 git에 실제 값을 커밋하지 마세요.
# .gitignore에 k8s/secrets.yaml 또는 **/secrets.yaml 추가 권장.

apiVersion: v1
kind: Secret
metadata:
  name: trading-secrets
  namespace: trading
  labels:
    app: psar-trading-bot
type: Opaque
data:
  # Binance API 자격증명
  # echo -n 'your-binance-api-key' | base64
  BINANCE_API_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE

  # echo -n 'your-binance-api-secret' | base64
  BINANCE_API_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE

  # Telegram 봇 설정
  # echo -n 'your-telegram-bot-token' | base64
  TELEGRAM_BOT_TOKEN: REPLACE_WITH_BASE64_ENCODED_VALUE

  # echo -n 'your-telegram-chat-id' | base64
  TELEGRAM_CHAT_ID: REPLACE_WITH_BASE64_ENCODED_VALUE

  # Grafana 관리자 비밀번호
  # echo -n 'your-grafana-password' | base64
  GRAFANA_ADMIN_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE

  # TradingView Webhook 시크릿
  # echo -n 'your-webhook-secret' | base64
  WEBHOOK_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE

  # Slack Webhook URL (cost_optimizer.py)
  # echo -n 'https://hooks.slack.com/services/...' | base64
  SLACK_WEBHOOK_URL: REPLACE_WITH_BASE64_ENCODED_VALUE
