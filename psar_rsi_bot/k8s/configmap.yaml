apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-config
  namespace: trading
  labels:
    app: psar-trading-bot
data:
  # 거래 설정
  TRADING_MODE: "LIVE"
  ALLOWED_SYMBOLS: "SOLUSDT"
  ALLOWED_TIMEFRAMES: "15m,1h,4h"
  LEVERAGE: "1"
  ORDER_SIZE_PCT: "10"

  # 서버 설정
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"

  # AWS 설정
  AWS_DEFAULT_REGION: "ap-northeast-2"

  # 모니터링
  PROMETHEUS_ENABLED: "true"
  LOG_LEVEL: "INFO"

  # 비용 최적화 스크립트
  REPORT_DIR: "/app/reports"
