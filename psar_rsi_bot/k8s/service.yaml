# FastAPI 앱 — 외부 노출 (NodePort)
# Minikube: minikube service psar-trading-bot -n trading
apiVersion: v1
kind: Service
metadata:
  name: psar-trading-bot
  namespace: trading
  labels:
    app: psar-trading-bot
spec:
  type: NodePort
  selector:
    app: psar-trading-bot
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30800

---
# Prometheus — 내부 전용 (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: trading
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090

---
# Grafana — 외부 노출 (NodePort)
# Minikube: minikube service grafana -n trading
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: trading
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30300
